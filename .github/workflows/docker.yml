name: Docker

# Publish the self-host image to GitHub Container Registry on releases.
# Uses GITHUB_TOKEN — no extra secrets needed. Users then run:
#   docker run -p 3344:3344 -v socials-vault:/data ghcr.io/aryaminus/socials-assistant
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ghcr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - name: Install + test before building image
        run: |
          pnpm install --frozen-lockfile=true
          pnpm exec tsc -b packages/shared packages/vault packages/connectors apps/mcp
          npx tsx --test packages/shared/test/*.test.ts packages/vault/test/*.test.ts
          npx tsx scripts/audit-mcp.ts
          npx tsx scripts/lint-skills.ts
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
