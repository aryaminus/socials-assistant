name: Release
run-name: Release (${{ github.ref_name }} @ ${{ github.sha }})

# Astro-style tag-driven release:
#   1. Bump version in 4 files + CHANGELOG.md
#   2. Commit: chore(release): bump version to X.Y.Z
#   3. git tag vX.Y.Z && git push origin vX.Y.Z
#
# This workflow:
#   - Waits for Release Smoke to succeed for this SHA
#   - Downloads the smoke artifact (skill bundles + npm tarball)
#   - Signs with cosign (keyless OIDC)
#   - Creates GitHub Release with all assets
#   - Publishes to npm with provenance
#   - Verifies all channels

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build the release for, e.g. v0.4.0"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  # ── Step 1: Wait for Release Smoke ──────────────────────────────────
  prepare-release-candidate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag + SHA
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (version ${TAG#v})"

      - name: Find successful Release Smoke run for this SHA
        id: smoke_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.tag.outputs.version }}"

          # Verify version consistency across 5 files
          PKG=$(node -p "require('./package.json').version")
          MCP=$(node -p "require('./apps/mcp/package.json').version")
          SRV=$(node -p "require('./server.json').version")
          PLG=$(node -p "require('./.claude-plugin/plugin.json').version")
          echo "tag=$VERSION pkg=$PKG mcp=$MCP server=$SRV plugin=$PLG"
          [ "$VERSION" = "$PKG" ] || { echo "::error::tag v$VERSION != package.json $PKG"; exit 1; }
          [ "$VERSION" = "$MCP" ] || { echo "::error::tag v$VERSION != apps/mcp/package.json $MCP"; exit 1; }
          [ "$VERSION" = "$SRV" ] || { echo "::error::tag v$VERSION != server.json $SRV"; exit 1; }
          [ "$VERSION" = "$PLG" ] || { echo "::error::tag v$VERSION != .claude-plugin/plugin.json $PLG"; exit 1; }

          # Verify CHANGELOG has entry
          if ! grep -q "## \\[${VERSION}\\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for version $VERSION"
            exit 1
          fi
          echo "Version + CHANGELOG verified for $TAG"

          # Find successful Release Smoke for this SHA
          ATTEMPTS=30
          SLEEP_SECONDS=20
          RUN_ID=""

          for attempt in $(seq 1 "$ATTEMPTS"); do
            RUNS_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release-smoke.yml/runs?branch=main&event=push&per_page=100")

            RUN_ID=$(echo "$RUNS_JSON" | jq -r --arg sha "${{ github.sha }}" '.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success") | .id' | head -n 1)
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              echo "Found successful Release Smoke run: ${RUN_ID}"
              break
            fi

            STATUS=$(echo "$RUNS_JSON" | jq -r --arg sha "${{ github.sha }}" '.workflow_runs[] | select(.head_sha == $sha) | .status' | head -n 1)
            CONCLUSION=$(echo "$RUNS_JSON" | jq -r --arg sha "${{ github.sha }}" '.workflow_runs[] | select(.head_sha == $sha) | .conclusion' | head -n 1)

            if [ -n "$STATUS" ] && [ "$STATUS" != "null" ]; then
              echo "Attempt ${attempt}/${ATTEMPTS}: Release Smoke for ${{ github.sha }} status=${STATUS} conclusion=${CONCLUSION}"
              if [ "$STATUS" = "completed" ] && [ -n "$CONCLUSION" ] && [ "$CONCLUSION" != "null" ] && [ "$CONCLUSION" != "success" ]; then
                echo "Release Smoke completed with conclusion=${CONCLUSION}; cannot publish." >&2
                exit 1
              fi
            else
              echo "Attempt ${attempt}/${ATTEMPTS}: No Release Smoke run found yet."
            fi

            if [ "$attempt" -lt "$ATTEMPTS" ]; then sleep "$SLEEP_SECONDS"; fi
          done

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful Release Smoke found after $((ATTEMPTS * SLEEP_SECONDS))s." >&2
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download release candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_NAME="release-candidate-dist-${GITHUB_SHA}"
          mkdir -p /tmp/release-candidate
          gh run download "${{ steps.smoke_run.outputs.run_id }}" -R "${GITHUB_REPOSITORY}" -n "$ARTIFACT_NAME" -D /tmp/release-candidate
          ls -la /tmp/release-candidate/

      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-dist
          path: /tmp/release-candidate
          retention-days: 1

  # ── Step 2: Sign with cosign ────────────────────────────────────────
  sign-release:
    needs: prepare-release-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-dist
          path: dist
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign release artifacts
        env:
          COSIGN_EXPERIMENTAL: true
        run: |
          for f in dist/bundle/* dist/skills/*; do
            if [ -f "$f" ]; then
              cosign sign-blob "$f" --output-signature "$f.sig" --output-certificate "$f.pem" --yes
            fi
          done
      - name: Generate checksums
        run: |
          find dist -maxdepth 2 -type f ! -name '*.sig' ! -name '*.pem' ! -name 'checksums.txt' -print0 | sort -z | xargs -0 sha256sum > dist/checksums.txt
          sha256sum -c dist/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-signed-dist
          path: dist
          retention-days: 1

  # ── Step 3: Create GitHub Release ───────────────────────────────────
  release:
    needs: sign-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-signed-dist
          path: dist
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          # Render release notes from CHANGELOG
          NOTES=$(awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then NOTES="Release ${TAG}"; fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/bundle/* dist/skills/* dist/checksums.txt --clobber
            gh release edit "${TAG}" --title "${TAG}" --notes "$NOTES" --latest
          else
            gh release create "${TAG}" dist/bundle/* dist/skills/* dist/checksums.txt \
              --verify-tag --title "${TAG}" --notes "$NOTES" --latest
          fi

  # ── Step 4: Publish to npm ──────────────────────────────────────────
  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # for cosign provenance; npm Trusted Publishing (OIDC) when ready
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - name: Build + publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Configure npm auth (setup-node's registry-url conflicts with token)
          npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"

          pnpm install --frozen-lockfile=true
          pnpm exec tsc -b packages/shared packages/vault packages/connectors apps/mcp

          pnpm --filter @aryaminus/socials-mcp run prepack
          (cd apps/mcp && npm pack)

          PACKAGE_NAME=$(node -p "require('./apps/mcp/package.json').name")
          PACKAGE_VERSION=$(node -p "require('./apps/mcp/package.json').version")

          if [ "${PACKAGE_VERSION}" != "${VERSION}" ]; then
            echo "Refusing to publish ${PACKAGE_NAME}@${PACKAGE_VERSION} for tag v${VERSION}." >&2
            exit 1
          fi

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists on npm; skipping."
            exit 0
          fi

          cd apps/mcp && npm publish --access public --provenance

  # ── Step 5: Verify all channels ─────────────────────────────────────
  verify-channels:
    needs: [release, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          registry-url: https://registry.npmjs.org
      - name: Verify publish channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          NPM_NAME=$(node -p "require('./apps/mcp/package.json').name")

          echo "=== Channel verification for ${TAG} ==="
          FAIL=0

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "PASS  GitHub Release ${TAG}"
          else
            echo "FAIL  GitHub Release ${TAG} not found"
            FAIL=1
          fi

          if npm view "${NPM_NAME}@${VERSION}" --registry=https://registry.npmjs.org version >/dev/null 2>&1; then
            echo "PASS  npm ${NPM_NAME}@${VERSION}"
          else
            echo "FAIL  npm ${NPM_NAME}@${VERSION} not found"
            FAIL=1
          fi

          echo "=== Summary ==="
          if [ "$FAIL" -ne 0 ]; then
            echo "One or more required channels missing for ${TAG}."
            exit 1
          fi
          echo "All required channels verified for ${TAG}."
