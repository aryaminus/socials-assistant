services:
  - type: web
    name: socials-mcp
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SOCIALS_DATA_DIR
        value: /data
      - key: SOCIALS_MCP_TOKEN
        sync: false   # set in dashboard — required on a public URL
      - key: SOCIALS_GOOGLE_CLIENT_ID
        sync: false
      - key: SOCIALS_GOOGLE_CLIENT_SECRET
        sync: false
      - key: SOCIALS_META_APP_ID
        sync: false
      - key: SOCIALS_META_APP_SECRET
        sync: false
      - key: SOCIALS_TIKTOK_CLIENT_KEY
        sync: false
      - key: SOCIALS_TIKTOK_CLIENT_SECRET
        sync: false
